name: CI

on:
  push:
  pull_request:

env:
  # CI runs against the synthetic data fallback -- fast and network-independent.
  # The real 284k-row fraud dataset is fetched/cached on demand for local dev
  # and demo runs; see modelvault/model/data_prep.py.
  MODELVAULT_FORCE_SYNTHETIC_DATA: "1"

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import smoke test
        run: |
          python -c "import modelvault.gateway.api"
          python -c "import modelvault.model.train"
          python -c "import attack_sim.evaluate"

      - name: Train target model (synthetic fallback data)
        run: python -m modelvault.model.train

      - name: Run tests
        run: pytest tests/ -q
