name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import smoke test
        run: |
          python -c "import modelvault.gateway.api"
          python -c "import modelvault.model.train"
          python -c "import attack_sim.evaluate"

      - name: Train target model
        run: python -m modelvault.model.train

      - name: Run tests
        run: pytest tests/ -q
